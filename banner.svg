<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0b0f"/>
      <stop offset="100%" style="stop-color:#13131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#7B1410"/>
      <stop offset="28%"  style="stop-color:#C0392B"/>
      <stop offset="58%"  style="stop-color:#E74C3C"/>
      <stop offset="82%"  style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="orb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   style="stop-color:#C0392B;stop-opacity:0.20"/>
      <stop offset="55%"  style="stop-color:#C0392B;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#ffffff" opacity="0.022"/>
    </pattern>
    <clipPath id="logo-clip">
      <circle cx="27" cy="27" r="26"/>
    </clipPath>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <rect x="0" y="278" width="680" height="1" fill="url(#accent)" opacity="0.25"/>

  <circle cx="1080" cy="140" r="160" fill="url(#orb-glow)"/>
  <circle cx="1080" cy="140" r="112" fill="none" stroke="#C0392B" stroke-width="0.8" opacity="0.14"/>
  <circle cx="1080" cy="140" r="80"  fill="none" stroke="#E74C3C" stroke-width="0.8" opacity="0.12"/>
  <circle cx="1080" cy="140" r="50"  fill="none" stroke="#D97706" stroke-width="0.8" opacity="0.18"/>
  <circle cx="1080" cy="140" r="22"  fill="none" stroke="#C0392B" stroke-width="1"   opacity="0.28"/>

  <line x1="1080" y1="16"  x2="1080" y2="28"  stroke="#C0392B" stroke-width="1" opacity="0.32"/>
  <line x1="1080" y1="252" x2="1080" y2="264" stroke="#C0392B" stroke-width="1" opacity="0.32"/>
  <line x1="956"  y1="140" x2="968"  y2="140" stroke="#C0392B" stroke-width="1" opacity="0.32"/>
  <line x1="1192" y1="140" x2="1200" y2="140" stroke="#C0392B" stroke-width="1" opacity="0.32"/>

  <circle cx="1080" cy="28"  r="3.5" fill="#C0392B" opacity="0.75"/>
  <circle cx="1165" cy="96"  r="2.5" fill="#E74C3C" opacity="0.55"/>
  <circle cx="1152" cy="218" r="2.5" fill="#D97706" opacity="0.55"/>
  <circle cx="1008" cy="218" r="2.5" fill="#D97706" opacity="0.55"/>
  <circle cx="995"  cy="96"  r="3.5" fill="#C0392B" opacity="0.60"/>
  <circle cx="1080" cy="140" r="2.5" fill="#E74C3C" opacity="0.55"/>

  <text x="72" y="100"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="54" font-weight="700"
    fill="#f0f0f8" letter-spacing="-0.025em">Nicolas Benavides</text>

  <text x="74" y="146"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="19" font-weight="400"
    fill="#9898b4" letter-spacing="0.01em">Administrador de Empresas · Co-fundador de Fixoria · Builder</text>

  <rect x="72" y="166" width="430" height="1.5" fill="#C0392B" opacity="0.48"/>

  <text x="72" y="202"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="15" fill="#70708a">Construyo sistemas reales: ERPs industriales, herramientas de diagnóstico IA,</text>
  <text x="72" y="222"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-size="15" fill="#70708a">automatización de procesos. Código que funciona en producción.</text>

  <image href="data:image/png;base64,"
         x="755" y="222" width="54" height="54"
         clip-path="url(#logo-clip)"
         opacity="0.82"/>

  <rect x="72" y="246" width="220" height="24" rx="5" fill="#C0392B" opacity="0.09"/>
  <rect x="72" y="246" width="220" height="24" rx="5" fill="none" stroke="#C0392B" stroke-width="1" opacity="0.32"/>
  <circle cx="91" cy="258" r="3.5" fill="#C0392B" opacity="0.65"/>
  <text x="102" y="263"
    font-family="system-ui,-apple-system,sans-serif"
    font-size="12" font-weight="500"
    fill="#cc5252">fixoria.com.co · Popayán, Colombia</text>
</svg>